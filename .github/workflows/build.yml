name: Build Manta Rust Core & Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-manta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Manta Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Rust Stable & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Run Manta Rust Core Unit Tests
        run: cargo test --manifest-path Cargo.toml --verbose

      - name: Locate or Install Android NDK
        run: |
          if [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_VER=$(ls -1 "$ANDROID_HOME/ndk" | sort -V | tail -n 1)
          fi
          if [ -z "$NDK_VER" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0"
            NDK_VER="27.2.12479018"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV
          echo "Using ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER"

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Compile Rust Core (libmanta_core.so) for Android ABIs
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o app/src/main/jniLibs \
            build --release --manifest-path Cargo.toml

      - name: Inspect Compiled Rust Engine Binary Size
        run: ls -lh app/src/main/jniLibs/arm64-v8a/libmanta_core.so

      - name: Sync Root logo.png into Android Drawable Resources
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp logo.png app/src/main/res/drawable-nodpi/logo.png

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build R8-Minified Release & Debug APKs
        run: gradle assembleRelease assembleDebug --no-daemon

      - name: Upload Manta Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manta-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Manta Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manta-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
