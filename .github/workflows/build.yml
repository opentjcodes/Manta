name: Build, Test & Release Manta Rust Core Engine

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manta-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Manta Core Repository
        uses: actions/checkout@v5

      - name: Install Rust Stable & Cross-Compilation Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Run Full Manta Core Unit & Integration Test Suite
        run: cargo test --manifest-path Cargo.toml --verbose

      - name: Build Host Linux x86_64 Release Engine (.so & .a)
        run: cargo build --release --manifest-path Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Locate or Install Android NDK for Mobile Targets
        run: |
          if [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_VER=$(ls -1 "$ANDROID_HOME/ndk" | sort -V | tail -n 1)
          fi
          if [ -z "$NDK_VER" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
            NDK_VER="27.2.12479018"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> $GITHUB_ENV

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build Android Multi-ABI Release Libraries
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o dist/android-jniLibs \
            build --release --manifest-path Cargo.toml

      - name: Package Manta Core SDK Bundle (Libraries + C Header)
        run: |
          mkdir -p dist/linux-x86_64 dist/include
          cp target/x86_64-unknown-linux-gnu/release/libmanta_core.so dist/linux-x86_64/
          cp target/x86_64-unknown-linux-gnu/release/libmanta_core.a dist/linux-x86_64/
          cp include/manta_core.h dist/include/
          ls -lh dist/linux-x86_64/ dist/android-jniLibs/arm64-v8a/
          tar -czvf Manta-Core-Engine-SDK.tar.gz -C dist .

      - name: Upload Manta Core Engine SDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manta-Core-Engine-SDK
          path: |
            Manta-Core-Engine-SDK.tar.gz
            dist/**

      - name: Publish GitHub Release (on Tag or Manual Dispatch)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && format('v2.0.{0}', github.run_number) || github.ref_name }}
          name: "Manta Core Engine ${{ github.ref_name == 'main' && format('v2.0.{0}', github.run_number) || github.ref_name }}"
          generate_release_notes: true
          files: |
            Manta-Core-Engine-SDK.tar.gz
            include/manta_core.h
